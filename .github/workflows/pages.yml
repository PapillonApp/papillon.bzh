name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - id: pages
        uses: actions/configure-pages@v5

      - run: bun install --frozen-lockfile

      - run: ./scripts/prepare-static-export.sh

      - run: bun run build
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Variantes des images
        run: bun scripts/resize-images.ts out

      - name: Fichiers Markdown à côté des pages
        run: cp -R out/md/. out/ && rm -rf out/md

      - name: Page 404
        run: cp out/fr/404/index.html out/404.html

      - name: Redirections sans langue
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          cd out/fr
          find . -name index.html -not -path './404/*' | while read -r page; do
          route=${page#./}
          route=${route%index.html}
          mkdir -p "../$route"
          META=$(grep -oE '<title>[^<]*</title>|<meta (name|property)="(description|og:[^"]*|twitter:[^"]*)"[^>]*>' "$page")
          cat > "../$route/index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          $META
          <script>location.replace("$BASE_PATH/" + (navigator.language.startsWith("fr") ? "fr" : "en") + "/$route" + location.search + location.hash)</script>
          <noscript><meta http-equiv="refresh" content="0; url=$BASE_PATH/fr/$route"></noscript>
          HTML
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
